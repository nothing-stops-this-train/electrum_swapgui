name: build-plugin

# Builds the external-plugin zip and runs the unit tests.
# The zip is a plain archive (no signing key/secret needed); users authorise it
# locally on install via Electrum's Plugins dialog.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Needed so the release step can create/update a GitHub Release on v* tags.
permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4
        with:
          path: electrum_swapgui

      - name: Checkout upstream Electrum (for imports during tests)
        uses: actions/checkout@v4
        with:
          repository: spesmilo/electrum
          ref: master
          path: electrum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          # Electrum's runtime deps needed to import the modules under test.
          pip install -r electrum/contrib/requirements/requirements.txt
          # electrum/crypto.py requires one of these (normally pulled in
          # transitively via the dnspython[DNSSEC] extra); install explicitly.
          pip install aiohttp cryptography
          # PyQt6 so tests/test_qt_tab.py actually runs instead of skipping.
          # It renders through the offscreen QPA platform, so no display is
          # needed, but Qt still links against these X libs on ubuntu-latest.
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          pip install PyQt6

      - name: Run unit tests
        env:
          ELECTRUM_SRC: ${{ github.workspace }}/electrum
          QT_QPA_PLATFORM: offscreen
        run: |
          cd electrum_swapgui
          python -m unittest discover -s tests -v

      - name: Determine plugin version
        id: version
        run: |
          cd electrum_swapgui
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # The tag is the single source of truth for a release version.
            version="${GITHUB_REF_NAME#v}"
            if [ -z "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME yields an empty version"
              exit 1
            fi
          else
            # Not a release: stamp a dev marker traceable to the commit, so any
            # zip handed out from a branch or PR build can be identified.
            version="dev-g$(git rev-parse --short=7 HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "plugin version: $version"

      - name: Build plugin zip
        run: |
          cd electrum_swapgui
          bash contrib/make_zip.sh "$GITHUB_WORKSPACE/dist" "${{ steps.version.outputs.version }}"

      - name: Verify the stamped version
        run: |
          cd "$GITHUB_WORKSPACE"
          unzip -p dist/swapserver_gui.zip swapserver_gui/_version.py \
            | grep -Fx '__version__ = "${{ steps.version.outputs.version }}"'

      - name: Upload plugin zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: swapserver_gui-plugin
          path: dist/swapserver_gui.zip
          if-no-files-found: error

      - name: Attach zip to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/swapserver_gui.zip
